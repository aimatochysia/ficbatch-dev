name: Iteration artifacts

# Builds installable artifacts (Android/Windows/Linux; macOS/iOS opt-in) so an
# iteration can be tested on real devices without cutting a release.
# Manual-only by user request: trigger from the Actions tab (or ask Claude)
# when you want testable builds — pushes no longer build automatically.
# Each job bumps the version locally (patch and build number +1, same rule as
# flutter_build.yml) so the binaries install over the last release; only a
# fully verified release commits a bump back to the repo.
on:
  workflow_dispatch:
    inputs:
      include_apple:
        description: "Also build macOS and iOS (unsigned)"
        type: boolean
        default: false

concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Bump version locally (not committed)
        run: |
          CURRENT=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          BASE=${CURRENT%+*}; BUILD=${CURRENT#*+}
          NEW="${BASE%.*}.$(( ${BASE##*.} + 1 ))+$((BUILD + 1))"
          sed -i "s/^version: .*/version: $NEW/" pubspec.yaml
          grep '^version:' pubspec.yaml
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ficbatch-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Bump version locally (not committed)
        shell: pwsh
        run: |
          $cur = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value).Trim()
          $base, $build = $cur -split '\+'
          $p = $base -split '\.'
          $new = "$($p[0]).$($p[1]).$([int]$p[2] + 1)+$([int]$build + 1)"
          (Get-Content pubspec.yaml) -replace '^version: .*', "version: $new" | Set-Content pubspec.yaml
          Select-String -Path pubspec.yaml -Pattern '^version:'
      - run: flutter build windows --release
      - name: Zip Windows build
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ficbatch-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ficbatch-windows
          path: ficbatch-windows.zip
          retention-days: 14

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libglib2.0-dev liblzma-dev libsecret-1-dev
      - run: flutter pub get
      - name: Bump version locally (not committed)
        run: |
          CURRENT=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          BASE=${CURRENT%+*}; BUILD=${CURRENT#*+}
          NEW="${BASE%.*}.$(( ${BASE##*.} + 1 ))+$((BUILD + 1))"
          sed -i "s/^version: .*/version: $NEW/" pubspec.yaml
          grep '^version:' pubspec.yaml
      - run: flutter build linux --release
      - name: Zip Linux build
        run: |
          cd build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/ficbatch-linux.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: ficbatch-linux
          path: ficbatch-linux.zip
          retention-days: 14

  build-macos:
    name: macOS (opt-in)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_apple }}
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - name: Bump version locally (not committed)
        run: |
          CURRENT=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          BASE=${CURRENT%+*}; BUILD=${CURRENT#*+}
          NEW="${BASE%.*}.$(( ${BASE##*.} + 1 ))+$((BUILD + 1))"
          perl -pi -e "s/^version: .*/version: $NEW/" pubspec.yaml
          grep '^version:' pubspec.yaml
      - run: flutter build macos --release
      - name: Zip macOS app
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/ficbatch-macos.zip" *.app
      - uses: actions/upload-artifact@v4
        with:
          name: ficbatch-macos
          path: ficbatch-macos.zip
          retention-days: 14

  build-ios:
    name: iOS unsigned (opt-in)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_apple }}
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Bump version locally (not committed)
        run: |
          CURRENT=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          BASE=${CURRENT%+*}; BUILD=${CURRENT#*+}
          NEW="${BASE%.*}.$(( ${BASE##*.} + 1 ))+$((BUILD + 1))"
          perl -pi -e "s/^version: .*/version: $NEW/" pubspec.yaml
          grep '^version:' pubspec.yaml
      # flutter build ios generates the Podfile and runs pod install itself.
      - run: flutter build ios --release --no-codesign
      - name: Zip iOS .app
        run: |
          APP_PATH=$(ls -d build/ios/iphoneos/*.app | head -n 1)
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/ficbatch-ios-app.zip" "$(basename "$APP_PATH")"
      - uses: actions/upload-artifact@v4
        with:
          name: ficbatch-ios-unsigned
          path: ficbatch-ios-app.zip
          retention-days: 14
