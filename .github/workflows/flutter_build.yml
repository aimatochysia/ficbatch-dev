name: Build All Platforms and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v0.7.2); 'auto' derives it from the bumped pubspec version"
        type: string
        default: "auto"

permissions:
  contents: read

jobs:
  build-ubuntu:
    name: Build Android, Linux
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
      version: ${{ steps.set-tag.outputs.version }}
    continue-on-error: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-v2
          restore-keys: |
            flutter-${{ runner.os }}-

      - name: Clean Flutter project
        run: |
          flutter clean
          rm -rf build pubspec.lock

      - name: Install dependencies
        run: flutter pub get

      # Every run bumps the version (patch and Android build number +1) so
      # each release is installable over the previous one. The bump is only
      # committed back to the branch by the release job, and only after every
      # platform artifact has been verified to exist and be non-empty.
      - name: Bump version and set release tag
        id: set-tag
        run: |
          CURRENT=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          BASE=${CURRENT%+*}
          BUILD=${CURRENT#*+}
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          PATCH=$(echo "$BASE" | cut -d. -f3)
          TAG="${{ inputs.release_tag }}"
          if [ -n "$TAG" ] && [ "$TAG" != "auto" ]; then
            if echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              # An explicit vX.Y.Z tag drives the app version.
              NEW_BASE="${TAG#v}"
            else
              NEW_BASE="$MAJOR.$MINOR.$((PATCH + 1))"
            fi
          else
            NEW_BASE="$MAJOR.$MINOR.$((PATCH + 1))"
            TAG="v$NEW_BASE"
          fi
          VERSION="$NEW_BASE+$((BUILD + 1))"
          echo "Version: $CURRENT -> $VERSION  Tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Apply version to this build
        run: |
          sed -i "s/^version: .*/version: ${{ steps.set-tag.outputs.version }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Decode Android keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/ficbatch-release-key.jks

      - name: Validate Android keystore
        id: validate-keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          if [[ -z "${KEYSTORE_PASSWORD}" || -z "${KEY_ALIAS}" || -z "${KEY_PASSWORD}" ]]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keytool -list -v \
            -keystore android/app/ficbatch-release-key.jks \
            -alias "${KEY_ALIAS}" \
            -storepass "${KEYSTORE_PASSWORD}" \
            -keypass "${KEY_PASSWORD}" >/dev/null 2>&1
          if [[ $? -eq 0 ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write Android signing key.properties
        if: ${{ steps.validate-keystore.outputs.ok == 'true' }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=ficbatch-release-key.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
        working-directory: ${{ github.workspace }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Remove key.properties when invalid
        if: ${{ steps.validate-keystore.outputs.ok != 'true' }}
        run: rm -f android/key.properties

      - name: Build Signed Android APK
        if: ${{ steps.validate-keystore.outputs.ok == 'true' }}
        run: flutter build apk --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Unsigned Android APK
        if: ${{ steps.validate-keystore.outputs.ok != 'true' }}
        run: flutter build apk --release

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libglib2.0-dev liblzma-dev libsecret-1-dev fakeroot dpkg-dev

      - name: Build Linux
        run: flutter build linux --release

      - name: Create Linux .deb package
        run: |
          mkdir -p dist/deb/ficbatch/usr/local/bin
          cp -r build/linux/x64/release/bundle/* dist/deb/ficbatch/usr/local/bin/
          mkdir -p dist/deb/ficbatch/DEBIAN
          DEB_VERSION="${{ steps.set-tag.outputs.version }}"
          cat <<EOF > dist/deb/ficbatch/DEBIAN/control
          Package: ficbatch
          Version: ${DEB_VERSION%+*}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: GitHub Actions
          Description: FicBatch - AO3 browser and reader
          EOF
          dpkg-deb --build dist/deb/ficbatch ficbatch-linux.deb

      - name: Prepare Android artifact
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ficbatch.apk

      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-artifacts
          path: |
            ficbatch.apk
            ficbatch-linux.deb
          if-no-files-found: error


  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: build-ubuntu
    continue-on-error: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4

      - name: Install dependencies
        run: flutter pub get

      - name: Apply release version
        shell: pwsh
        run: |
          $v = '${{ needs.build-ubuntu.outputs.version }}'
          if (-not [string]::IsNullOrWhiteSpace($v)) {
            (Get-Content pubspec.yaml) -replace '^version: .*', "version: $v" | Set-Content pubspec.yaml
            Select-String -Path pubspec.yaml -Pattern '^version:'
          }

      - name: Build Windows
        run: flutter build windows --release

      - name: Resolve App Version
        shell: pwsh
        run: |
          $v='${{ needs.build-ubuntu.outputs.tag }}'
          if ([string]::IsNullOrWhiteSpace($v)) { $v = (Get-Date -Format 'yyyy.MM.dd.HHmm') }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: pwsh
      - name: Generate Inno Setup script
        shell: pwsh
        run: |
          $sourceDir = (Resolve-Path "build\windows\x64\runner\Release").Path
          $outDir = $env:RUNNER_TEMP
          $iss = @"
          #define MyAppName "FicBatch"
          #define MyAppVersion "${env:APP_VERSION}"
          #define OutputBase "ficbatch-windows"
          #define SourceDir "$($sourceDir)"
          #define OutDir "$($outDir)"
          [Setup]
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          DisableDirPage=no
          DisableProgramGroupPage=yes
          OutputBaseFilename={#OutputBase}
          OutputDir={#OutDir}
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          WizardStyle=modern
          [Files]
          Source: "{#SourceDir}\*"; DestDir: "{app}"; Flags: recursesubdirs
          [Icons]
          Name: "{autoprograms}\{#MyAppName}"; Filename: "{app}\ficbatch.exe"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\ficbatch.exe"; Tasks: desktopicon
          [Tasks]
          Name: "desktopicon"; Description: "Create a &desktop shortcut"; GroupDescription: "Additional icons:"
          "@
          $issPath = Join-Path $env:RUNNER_TEMP "installer.iss"
          Set-Content -Path $issPath -Value $iss -Encoding UTF8
          Write-Host "Generated: $issPath with SourceDir=$sourceDir and OutputDir=$outDir"
      - name: Create Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Qp "$env:RUNNER_TEMP\installer.iss"
      - name: Collect installer artifact
        shell: pwsh
        run: |
          Copy-Item "$env:RUNNER_TEMP\ficbatch-windows.exe" "$pwd\ficbatch-windows.exe" -Force
          if (!(Test-Path "ficbatch-windows.exe")) {
            Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ficbatch-windows.zip -Force
          }
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            ficbatch-windows.exe
            ficbatch-windows.zip
          if-no-files-found: warn


  build-macos:
    name: Build macOS Installer
    runs-on: macos-latest
    needs: build-ubuntu
    continue-on-error: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4

      - name: Install dependencies
        run: flutter pub get

      - name: Apply release version
        run: |
          V="${{ needs.build-ubuntu.outputs.version }}"
          if [ -n "$V" ]; then
            perl -pi -e "s/^version: .*/version: $V/" pubspec.yaml
            grep '^version:' pubspec.yaml
          fi

      - name: Verify macOS support
        run: |
          if [ ! -d "macos" ]; then
            echo "macOS directory not found. Creating macOS support..."
            flutter create --platforms=macos .
          fi
          flutter config --enable-macos-desktop

      - name: Build macOS
        run: flutter build macos --release

      # Zip the .app directly — the previous create-dmg step failed silently
      # (|| true) and if-no-files-found: warn let the job pass with no artifact,
      # which is why the macOS build "succeeded" but nothing reached the release.
      - name: Zip macOS app
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/ficbatch-macos.zip" *.app

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            ficbatch-macos.zip
          if-no-files-found: error


  build-ios:
    name: Build iOS (unsigned .app)
    runs-on: macos-latest
    needs: build-ubuntu
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods --no-document || true
          pod repo update || true
      - name: Flutter pub get
        run: flutter pub get
      - name: Apply release version
        run: |
          V="${{ needs.build-ubuntu.outputs.version }}"
          if [ -n "$V" ]; then
            perl -pi -e "s/^version: .*/version: $V/" pubspec.yaml
            grep '^version:' pubspec.yaml
          fi
      # flutter build ios generates the Podfile and runs pod install itself.
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
      - name: Package iOS .app
        run: |
          mkdir -p dist/ios
          APP_PATH=$(ls -d build/ios/iphoneos/*.app | head -n 1)
          if [ -d "$APP_PATH" ]; then
            cd "$(dirname "$APP_PATH")"
            zip -r "$GITHUB_WORKSPACE/ficbatch-ios-app.zip" "$(basename "$APP_PATH")"
          fi
      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: |
            ficbatch-ios-app.zip
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-ubuntu, build-windows, build-macos, build-ios]
    permissions:
      contents: write

    steps:
      - name: Checkout source (for RELEASE_NOTES.md)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          path: release-dist

      # Job status alone lied to us before (a job can "succeed" with no
      # artifact) — check every platform's file exists and is non-empty.
      - name: Verify platform artifacts
        id: verify
        run: |
          ANY_OK=false
          ALL_OK=true
          check() {
            local FOUND
            FOUND=$(find release-dist -type f -name "$2" -size +0c | head -n 1)
            if [ -n "$FOUND" ]; then
              echo "$1_ok=true" >> "$GITHUB_OUTPUT"
              echo "✅ $2 ($(stat -c%s "$FOUND") bytes)"
              ANY_OK=true
            else
              echo "$1_ok=false" >> "$GITHUB_OUTPUT"
              echo "❌ $2 missing or empty"
              ALL_OK=false
            fi
          }
          check android ficbatch.apk
          check linux ficbatch-linux.deb
          check windows ficbatch-windows.exe
          check macos ficbatch-macos.zip
          check ios ficbatch-ios-app.zip
          echo "any_ok=$ANY_OK" >> "$GITHUB_OUTPUT"
          echo "all_ok=$ALL_OK" >> "$GITHUB_OUTPUT"

      - name: Set release metadata
        id: release-info
        run: |
          TAG="${{ needs.build-ubuntu.outputs.tag }}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "RELEASE_NAME=Build $TAG" >> $GITHUB_ENV

          {
            echo "RELEASE_BODY<<EOF"
            if [ -f RELEASE_NOTES.md ]; then
              cat RELEASE_NOTES.md
              echo ""
              echo "---"
              echo ""
            fi
            echo "App version: \`${{ needs.build-ubuntu.outputs.version }}\`"
            echo ""
            echo "Build results (each artifact verified to exist and be non-empty):"
            echo ""
            if [ "${{ steps.verify.outputs.android_ok }}" = "true" ]; then
              echo "- ✅ Android: ficbatch.apk"
            else
              echo "- ❌ Android: ficbatch.apk missing"
            fi
            if [ "${{ steps.verify.outputs.linux_ok }}" = "true" ]; then
              echo "- ✅ Linux: ficbatch-linux.deb"
            else
              echo "- ❌ Linux: ficbatch-linux.deb missing"
            fi
            if [ "${{ steps.verify.outputs.windows_ok }}" = "true" ]; then
              echo "- ✅ Windows: ficbatch-windows.exe"
            else
              echo "- ❌ Windows: ficbatch-windows.exe missing"
            fi
            if [ "${{ steps.verify.outputs.macos_ok }}" = "true" ]; then
              echo "- ✅ macOS: ficbatch-macos.zip (unzip and drag FicBatch.app to Applications)"
            else
              echo "- ❌ macOS: ficbatch-macos.zip missing"
            fi
            if [ "${{ steps.verify.outputs.ios_ok }}" = "true" ]; then
              echo "- ✅ iOS (unsigned): ficbatch-ios-app.zip"
            else
              echo "- ❌ iOS (unsigned): ficbatch-ios-app.zip missing"
            fi
            echo ""
            if [ "${{ steps.verify.outputs.all_ok }}" = "true" ]; then
              echo "All platform artifacts verified — version committed back to \`${{ github.ref_name }}\`."
            else
              echo "⚠️ Not all artifacts made it — the version bump was NOT committed; a re-run will reuse version \`${{ needs.build-ubuntu.outputs.version }}\` and tag \`$TAG\`."
            fi
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Stop if no artifacts were produced
        if: steps.verify.outputs.any_ok != 'true'
        run: |
          echo "❌ No platform produced a usable artifact. Skipping release."
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # Without this, a fresh tag is created on the default branch, not
          # the commit that was actually built.
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_BODY }}
          files: |
            release-dist/**/*
          overwrite_files: true

      # Only a fully verified release moves the version forward in git, so
      # the repo version always reflects the last complete release and a
      # partially failed run can simply be re-run with the same version/tag.
      - name: Commit released version back to the source branch
        if: steps.verify.outputs.all_ok == 'true'
        run: |
          VERSION="${{ needs.build-ubuntu.outputs.version }}"
          BRANCH="${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          sed -i "s/^version: .*/version: $VERSION/" pubspec.yaml
          if git diff --quiet; then
            echo "Version $VERSION is already committed."
          else
            git add pubspec.yaml
            git commit -m "Bump version to $VERSION (released as ${{ needs.build-ubuntu.outputs.tag }})"
            git push origin "$BRANCH"
          fi
