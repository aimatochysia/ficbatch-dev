name: CI (analyze & test)

# Quality gate: runs static analysis and the unit/widget test suite on every
# push and pull request so regressions are caught before a release build.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 3.32.8 bundles Dart 3.8.1, which the project's `sdk: ^3.8.1`
          # constraint requires (3.32.0 ships Dart 3.8.0 and fails pub get).
          flutter-version: "3.32.8"
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting (non-blocking)
        run: dart format --output=none --set-exit-if-changed . || true

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  js-dom-tests:
    name: JS injector DOM tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        working-directory: tools/js-tests
        run: npm install --no-audit --no-fund

      - name: Run DOM tests against AO3 fixtures
        working-directory: tools/js-tests
        run: node --test
