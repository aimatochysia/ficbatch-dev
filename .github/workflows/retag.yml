name: Retag (maintenance)

# Utility: point a tag at a specific commit. Needed when a release tag was
# created on the wrong commit (before flutter_build.yml passed
# target_commitish, a fresh tag landed on the default branch instead of the
# built sha). Does not build or release anything.
#
# Two triggers:
# - workflow_dispatch (only usable once this file is on the default branch)
# - push touching .github/retag.json — edit that file with the desired
#   {"tag": ..., "sha": ...} and push; works from any branch.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (e.g. v0.7.1)"
        required: true
      sha:
        description: "Commit SHA the tag should point at"
        required: true
  push:
    paths:
      - ".github/retag.json"

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for retag.json on push trigger)
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Point tag at commit
        uses: actions/github-script@v7
        with:
          script: |
            let tag, sha;
            if (context.eventName === 'workflow_dispatch') {
              ({ tag, sha } = context.payload.inputs);
            } else {
              const fs = require('fs');
              ({ tag, sha } = JSON.parse(
                  fs.readFileSync('.github/retag.json', 'utf8')));
            }
            if (!tag || !sha) {
              core.setFailed('tag and sha are required');
              return;
            }
            const { owner, repo } = context.repo;

            // Deleting a release's tag converts the release to a draft, so
            // grab its id first to re-publish it afterwards.
            let releaseId = null;
            try {
              const rel = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              releaseId = rel.data.id;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            // GITHUB_TOKEN may not force-move a tag across commits whose
            // workflow files differ (needs workflows:write, which Actions
            // tokens can't have) — delete + recreate instead.
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
              core.info(`Deleted refs/tags/${tag}`);
            } catch (e) {
              if (e.status !== 404 && e.status !== 422) throw e;
            }

            await github.rest.git.createRef({
              owner, repo, ref: `refs/tags/${tag}`, sha,
            });
            core.info(`Created refs/tags/${tag} -> ${sha}`);

            if (releaseId !== null) {
              await github.rest.repos.updateRelease({
                owner, repo, release_id: releaseId, tag_name: tag, draft: false,
              });
              core.info(`Re-published release ${releaseId} on ${tag}`);
            }
