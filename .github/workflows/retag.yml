name: Retag (maintenance)

# Utility: point a tag at a specific commit. Needed when a release tag was
# created on the wrong commit (before flutter_build.yml passed
# target_commitish, a fresh tag landed on the default branch instead of the
# built sha). Does not build or release anything.
#
# Two triggers:
# - workflow_dispatch (only usable once this file is on the default branch)
# - push touching .github/retag.json — edit that file with the desired
#   {"tag": ..., "sha": ...} and push; works from any branch.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (e.g. v0.7.1)"
        required: true
      sha:
        description: "Commit SHA the tag should point at"
        required: true
  push:
    paths:
      - ".github/retag.json"

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for retag.json on push trigger)
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Point tag at commit
        uses: actions/github-script@v7
        with:
          script: |
            let tag, sha;
            if (context.eventName === 'workflow_dispatch') {
              ({ tag, sha } = context.payload.inputs);
            } else {
              const fs = require('fs');
              ({ tag, sha } = JSON.parse(
                  fs.readFileSync('.github/retag.json', 'utf8')));
            }
            if (!tag || !sha) {
              core.setFailed('tag and sha are required');
              return;
            }
            const { owner, repo } = context.repo;

            // GITHUB_TOKEN cannot create/move a tag ref pointing at a commit
            // whose workflow files differ from the default branch (the refs
            // API demands workflows:write, which Actions tokens can't get).
            // The releases API creates tags server-side on publish, so when a
            // release exists for the tag we go through that instead.
            const releases = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
            const rel = releases.data.find((r) => r.tag_name === tag);

            // Drop the old tag if present (deleting a published release's tag
            // converts the release to a draft; re-published below).
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
              core.info(`Deleted refs/tags/${tag}`);
            } catch (e) {
              if (e.status !== 404 && e.status !== 422) throw e;
            }

            if (rel) {
              try {
                await github.rest.repos.updateRelease({
                  owner, repo, release_id: rel.id,
                  tag_name: tag, target_commitish: sha, draft: false,
                });
                core.info(`Published release ${rel.id}: ${tag} -> ${sha}`);
              } catch (e) {
                // Restore the previous published state (tag on the release's
                // stored target branch) rather than leaving a draft behind.
                core.warning(`Publish at ${sha} failed (${e.status}); republishing on the stored target`);
                await github.rest.repos.updateRelease({
                  owner, repo, release_id: rel.id, tag_name: tag, draft: false,
                });
                core.setFailed(`Could not point ${tag} at ${sha}; release republished on its previous target`);
              }
            } else {
              await github.rest.git.createRef({
                owner, repo, ref: `refs/tags/${tag}`, sha,
              });
              core.info(`Created refs/tags/${tag} -> ${sha}`);
            }
