name: ficbatch
description: "AO3 browser and reader."

publish_to: "none"
version: 0.7.3+7

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_riverpod: ^2.6.0
  # hive_ce: maintained community fork of hive, drop-in compatible with hive
  # 2.x boxes; its generator works with current Dart/analyzer versions.
  hive_ce: ^2.10.0
  hive_ce_flutter: ^2.2.0
  http: ^1.2.0
  html: ^0.15.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  webview_flutter: ^4.14.0
  webview_flutter_android: ^4.0.0
  webview_flutter_wkwebview: ^3.26.0
  webview_windows: ^0.4.0
  path_provider: ^2.1.2
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^19.0.0
  connectivity_plus: ^6.1.0
  file_picker: ^11.0.2
  permission_handler: ^12.0.3
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  hive_ce_generator: ^1.8.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/js/
