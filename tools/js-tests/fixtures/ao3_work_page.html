<!DOCTYPE html>
<!-- Trimmed AO3 work-page fixture for the injector's saveWorkById metadata
     scrape (title, author, summary, tags, stats). -->
<html lang="en">
<head><title>The First Work - Archive of Our Own</title></head>
<body>
  <div id="workskin">
    <div class="preface group">
      <h2 class="title heading">The First Work</h2>
      <h3 class="byline heading"><a rel="author" href="/users/alice">alice</a></h3>
      <div class="summary module">
        <blockquote class="userstuff"><p>Summary one.</p></blockquote>
      </div>
    </div>
  </div>
  <dl class="work meta group">
    <dt class="rating tags">Rating:</dt>
    <dd class="rating tags"><a class="tag" href="#">General Audiences</a></dd>
    <dt class="fandom tags">Fandom:</dt>
    <dd class="fandom tags"><a class="tag" href="#">Some Fandom</a></dd>
    <dt class="freeform tags">Additional Tags:</dt>
    <dd class="freeform tags"><a class="tag" href="#">Fluff</a><a class="tag" href="#">Angst</a></dd>
    <dt class="language">Language:</dt>
    <dd class="language">English</dd>
    <dt class="stats">Stats:</dt>
    <dd class="stats">
      <dl class="stats">
        <dt class="published">Published:</dt><dd class="published">2024-05-01</dd>
        <dt class="status">Updated:</dt><dd class="status">2024-06-15</dd>
        <dt class="words">Words:</dt><dd class="words">12,345</dd>
        <dt class="chapters">Chapters:</dt><dd class="chapters">3/10</dd>
        <dt class="kudos">Kudos:</dt><dd class="kudos">420</dd>
        <dt class="hits">Hits:</dt><dd class="hits">9,001</dd>
      </dl>
    </dd>
  </dl>
</body>
</html>
